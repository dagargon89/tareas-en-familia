# CI de Tareas en Familia (T-S0-05, doc 06 §1). Corre en cada push y pull request.
# - api: PHPUnit sobre PHP 8.3 (la del hosting) y MariaDB 10.11 con cobertura ≥ 85 % (RNF-09).
# - web: lint, tipos, Vitest y build con Node 22.
# - e2e: Playwright contra la API real en 768 y 360 px y el build de producción (CP-NF-04).
# - paquete: solo en main; deja el release listo para el workflow "Despliegue".
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: intl, mbstring, gd, mysqli, exif, curl

jobs:
  api:
    name: API (PHPUnit + cobertura)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_ci
          MARIADB_DATABASE: tareas_test
          MARIADB_USER: tareas
          MARIADB_PASSWORD: tareas_local
        # phpunit.xml.dist espera la base de pruebas en 127.0.0.1:3307.
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2
      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('src/api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit con cobertura
        run: vendor/bin/phpunit --coverage-clover build/clover.xml
      - name: Cobertura mínima en Services y Domain (85 %)
        run: php ../../scripts/verificar_cobertura.php build/clover.xml 85

  web:
    name: Web (lint, tipos, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.test.json
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright contra la API real)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_ci
          MARIADB_DATABASE: tareas_dev
          MARIADB_USER: tareas
          MARIADB_PASSWORD: tareas_local
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: API con la base de demo
        working-directory: src/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          sed -e 's/^database.default.username =.*/database.default.username = tareas/' \
              -e 's/^database.default.password =.*/database.default.password = tareas_local/' \
              -e 's/^database.default.port = .*/database.default.port = 3307/' \
              -e "s/^encryption.key =.*/encryption.key = hex2bin:$(openssl rand -hex 32)/" env > .env
          php spark tareas:migrar
          php spark db:seed DemoSeeder
      - name: Web y navegador
        working-directory: src/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (tablet, celular y build)
        working-directory: src/web
        run: npx playwright test
      - name: Reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web/test-results/
          retention-days: 7

  paquete:
    name: Paquete del release
    runs-on: ubuntu-latest
    needs: [api, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build de la SPA
        working-directory: src/web
        run: npm ci && npm run build
      - run: scripts/empaquetar.sh build/release.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release.tar.gz
            scripts/deploy_remoto.sh
          retention-days: 14
